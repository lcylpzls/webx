name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        # setup-go v7 默认 GOTOOLCHAIN=local；staticcheck 2026.1 要求 Go >= 1.25，
        # 这里恢复 auto，让 Go 1.21 矩阵自动切换到所需工具链。
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          go test -race -count=1 ./... > race.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            REPORT=$(grep -A 60 'WARNING: DATA RACE' race.log | head -n 80 | tr '\n' ' ')
            if [ -z "$REPORT" ]; then
              REPORT=$(tail -n 40 race.log | tr '\n' ' ')
            fi
            echo "::error::$REPORT"
            exit $status
          fi

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: go test -count=1 -coverprofile=coverage.out $(go list ./... | grep -v '/examples/')

      - name: Show coverage
        if: runner.os == 'Linux'
        run: go tool cover -func coverage.out

      - name: Coverage gate (100%)
        if: runner.os == 'Linux'
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')
          echo "语句覆盖率：$total"
          if [ "$total" != "100.0%" ]; then
            echo "覆盖率未达 100%，禁止合入"
            exit 1
          fi

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Fuzz short run (10s per target)
        run: |
          go test -run '^$' -fuzz '^FuzzTranslatePattern$' -fuzztime=10s .
          go test -run '^$' -fuzz '^FuzzBindJSON$' -fuzztime=10s ./internal/core/
          go test -run '^$' -fuzz '^FuzzRateLimit$' -fuzztime=10s ./middleware/

  apidiff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@latest

      - name: Export v0.8.0 baseline API
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          git worktree add /tmp/webx-v0.8.0 v0.8.0
          cd /tmp/webx-v0.8.0
          apidiff -w /tmp/webx-old.bin .
          apidiff -w /tmp/middleware-old.bin ./middleware

      - name: Compare current API with baseline
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          apidiff -w /tmp/webx-new.bin .
          apidiff -w /tmp/middleware-new.bin ./middleware
          for pair in webx middleware; do
            echo "=== ${pair} ==="
            OUT=$(apidiff "/tmp/${pair}-old.bin" "/tmp/${pair}-new.bin")
            echo "$OUT"
            if echo "$OUT" | grep -q "Incompatible"; then
              echo "检测到破坏性 API 变更（违反 v0.8.0 冻结基线）"
              exit 1
            fi
          done

  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Benchmark
        run: go test -bench . -benchmem -run '^$' ./...
