name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.21.x', '1.26.x']
        # Go 1.21 构建的测试二进制无法在 macos-latest（新版 dyld）加载
        # （missing LC_UUID），macOS 仅验证 1.26.x。
        exclude:
          - os: macos-latest
            go: '1.21.x'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        # setup-go v7 默认 GOTOOLCHAIN=local；staticcheck 2026.1 要求 Go >= 1.25，
        # 这里恢复 auto，让 Go 1.21 矩阵自动切换到所需工具链。
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: go test -count=1 -coverprofile=coverage.out $(go list ./... | grep -v '/examples/')

      - name: Show coverage
        if: runner.os == 'Linux'
        run: go tool cover -func coverage.out

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Fuzz short run (10s per target)
        run: |
          go test -run '^$' -fuzz '^FuzzTranslatePattern$' -fuzztime=10s .
          go test -run '^$' -fuzz '^FuzzBindJSON$' -fuzztime=10s ./internal/core/
          go test -run '^$' -fuzz '^FuzzRateLimit$' -fuzztime=10s ./middleware/
