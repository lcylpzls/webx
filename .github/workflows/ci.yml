name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        # setup-go v7 默认 GOTOOLCHAIN=local；staticcheck 2026.1 要求 Go >= 1.25，
        # 这里恢复 auto，让 Go 1.21 矩阵自动切换到所需工具链。
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race detector
        shell: bash
        run: |
          set +e
          go test -race -count=1 ./... > race.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E '^(--- FAIL|WARNING: DATA RACE|panic:|FAIL|ok  )' race.log | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            {
              echo "### Race 失败日志"
              grep -E '^(--- FAIL|WARNING: DATA RACE|panic:|FAIL|ok  )' race.log | head -n 40
              echo "--- 末尾 ---"
              tail -n 25 race.log
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: go test -count=1 -coverprofile=coverage.out $(go list ./... | grep -v '/examples/')

      - name: Show coverage
        if: runner.os == 'Linux'
        run: go tool cover -func coverage.out

      - name: Coverage gate (100%)
        if: runner.os == 'Linux'
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')
          echo "语句覆盖率：$total"
          if [ "$total" != "100.0%" ]; then
            echo "覆盖率未达 100%，禁止合入"
            exit 1
          fi

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out

  linux-distros:
    name: test (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:bookworm
            prepare: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl tar
          - distro: fedora:41
            prepare: dnf -y install git ca-certificates curl tar
          - distro: rockylinux:9
            prepare: dnf -y install --setopt=install_weak_deps=False git
          - distro: archlinux:latest
            prepare: pacman -Syu --noconfirm git ca-certificates curl tar
          - distro: alpine:3.20
            prepare: apk add --no-cache git ca-certificates curl tar
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    env:
      # 容器矩阵仅验证纯 Go 构建链路（glibc/musl 差异），
      # cgo/race 由 ubuntu 主机作业覆盖。
      CGO_ENABLED: '0'
    steps:
      - name: Prepare environment
        run: ${{ matrix.prepare }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Test
        run: go test -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Fuzz short run (10s per target)
        run: |
          go test -run '^$' -fuzz '^FuzzTranslatePattern$' -fuzztime=10s .
          go test -run '^$' -fuzz '^FuzzBindJSON$' -fuzztime=10s ./internal/core/
          go test -run '^$' -fuzz '^FuzzBindForm$' -fuzztime=10s ./internal/core/
          go test -run '^$' -fuzz '^FuzzBindQuery$' -fuzztime=10s ./internal/core/
          go test -run '^$' -fuzz '^FuzzRateLimit$' -fuzztime=10s ./middleware/

  apidiff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@latest

      - name: Export v1.0.0 baseline API
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          git worktree add /tmp/webx-v1.0.0 v1.0.0
          cd /tmp/webx-v1.0.0
          apidiff -w /tmp/webx-old.bin .
          apidiff -w /tmp/middleware-old.bin ./middleware

      - name: Compare current API with baseline
        # v2.0.0 起为破坏性主版本：与 v1.0.0 基线对比改为信息性输出，
        # 不再作为门禁（破坏性变更随主版本发布）。
        continue-on-error: true
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          apidiff -w /tmp/webx-new.bin .
          apidiff -w /tmp/middleware-new.bin ./middleware
          for pair in webx middleware; do
            echo "=== ${pair} ==="
            OUT=$(apidiff "/tmp/${pair}-old.bin" "/tmp/${pair}-new.bin")
            echo "$OUT"
            if echo "$OUT" | grep -q "Incompatible"; then
              echo "检测到破坏性 API 变更（违反 v1.0.0 冻结基线）"
              exit 1
            fi
          done

  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Benchmark
        run: |
          go test -bench '^BenchmarkRouterServeHTTP500$' -benchmem -run '^$' . 2>&1 | tee bench.log
          ns=$(grep 'BenchmarkRouterServeHTTP500' bench.log | awk -F'ns/op' '{print $1}' | awk '{print $NF}')
          if [ -z "$ns" ]; then
            echo "基准解析失败"
            exit 1
          fi
          echo "路由 500 条：${ns} ns/op"
          if awk "BEGIN{exit !($ns > 1000)}"; then
            echo "路由性能回退超过阈值（1000ns）"
            exit 1
          fi
          allocs=$(grep 'BenchmarkRouterServeHTTP500' bench.log | awk -F'alloc/op' '{print $1}' | awk '{print $NF}')
          if [ -z "$allocs" ]; then
            echo "分配数解析失败"
            exit 1
          fi
          echo "路由 500 条：${allocs} allocs/op"
          if [ "$allocs" -gt 1 ]; then
            echo "路由分配回退超过阈值（要求 ≤1 allocs/op）"
            exit 1
          fi
          go test -bench '^BenchmarkSuccessResponse$' -benchmem -run '^$' . 2>&1 | tee resp-bench.log
          respAllocs=$(grep 'BenchmarkSuccessResponse' resp-bench.log | awk -F'alloc/op' '{print $1}' | awk '{print $NF}')
          if [ -z "$respAllocs" ]; then
            echo "响应编码分配数解析失败"
            exit 1
          fi
          echo "标准化响应：${respAllocs} allocs/op"
          if [ "$respAllocs" -gt 1 ]; then
            echo "标准化响应分配回退超过阈值（要求 ≤1 allocs/op）"
            exit 1
          fi
          go test -bench '^BenchmarkServerRequestFull$' -benchmem -run '^$' . 2>&1 | tee full-bench.log
          grep 'BenchmarkServerRequestFull' full-bench.log || exit 1
