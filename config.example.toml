# webx 参考配置：复制为 config.toml 并按需修改。

# --- TLS（必填） ---
tls_cert_file = "/etc/ssl/certs/server.crt"
tls_key_file = "/etc/ssl/private/server.key"
# 最低 TLS 版本：771=TLS1.2，772=TLS1.3（0=默认 TLS1.2）
min_tls_version = 771

# --- 超时 ---
read_timeout = "0s"            # 0=不限制读取超时
write_timeout = "0s"           # 0=不限制写入超时
read_header_timeout = "10s"    # 请求头读取超时（Slowloris 防护，默认 10s）
idle_timeout = "60s"           # 空闲连接超时（默认 60s）
request_timeout = "30s"        # Timeout 中间件单请求超时
shutdown_timeout = "30s"       # 优雅关闭最大等待
max_header_bytes = 1048576     # 请求头最大字节数
max_body_bytes = 10485760      # 全局请求体上限（默认 10MB，超限返回 413）

# --- QUIC / HTTP/3 ---
quic_max_idle_timeout = "30s"  # 空闲连接超时（默认 30s）
quic_max_incoming_streams = 100 # 单连接最大入站流数（默认 100）

# --- 健康检查 ---
health_path = "/health"        # 聚合探针（RegisterHealthCheck）
liveness_path = "/healthz"     # 存活探针（RegisterLivenessCheck）
readiness_path = "/readyz"     # 就绪探针（RegisterReadinessCheck，关闭中返回 503）

# --- 指标端点（Prometheus 文本格式，自研零依赖） ---
metrics_enabled = false            # true=启用 /metrics 指标端点
metrics_path = "/metrics"          # 端点路径（需以 / 开头）

# --- 平台限制 ---
# Unix Socket 监听（UseUnixSocketListen）在 Windows 上要求
# Windows 10 build 1803 (10.0.17134) 或更高版本；低于该版本时
# Start() 会拒绝初始化并返回 WEBX_START_FAILED。

# --- 日志 ---
log_level = "info"             # debug/info/warn/error
debug = false                  # 调试模式：Recovery 响应携带 panic 摘要（生产保持 false）
access_log_enabled = true
log_success_req = false        # true=记录成功请求
access_log_sample_rate = 0     # 0=全部记录，N>0 平均每 N 条记 1 条
access_log_redact = ["token", "password"] # query 脱敏键
slow_request_threshold = "0s"  # >0 时对慢请求额外记录 Warn（如 "1s"）

# --- 可信代理 ---
# 仅来自这些网段的请求才信任 X-Forwarded-For / X-Real-IP；
# 留空 = 不信任任何代理头（默认，防客户端伪造源 IP）。
# trusted_proxies = ["10.0.0.0/8", "192.168.1.5"]

# --- CORS（留空则使用默认值） ---
cors_allowed_origins = ["*"]
cors_allowed_methods = ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
cors_allowed_headers = ["Origin", "Content-Type", "Accept", "Authorization", "X-Request-ID"]
cors_expose_headers = ["X-Request-ID"]  # 允许浏览器读取的响应头
cors_max_age = "86400s"
cors_allow_private_network = false      # true=允许内网预检（Private Network Access）

# --- 响应压缩 ---
gzip_min_size = 1024             # 小于该字节数的响应不压缩
gzip_level = 0                   # 0=标准库默认，1-9 对应 BestSpeed-BestCompression

# --- 安全响应头 ---
security_hsts_max_age = 0                    # >0 时启用 HSTS（秒）
security_referrer_policy = ""                # 如 "no-referrer"
security_permissions_policy = ""             # 如 "camera=()"
security_cross_origin_opener_policy = ""     # 如 "same-origin"
security_cross_origin_resource_policy = ""   # 如 "same-origin"
security_cross_origin_embedder_policy = ""   # 如 "require-corp"
security_content_security_policy = ""        # 如 "default-src 'self'"
security_content_security_policy_report_only = "" # 只报告不拦截（灰度用）
security_hsts_include_subdomains = false     # HSTS 附加 includeSubDomains
security_hsts_preload = false                # HSTS 附加 preload（需先满足提交条件）
security_origin_agent_cluster = false        # true=输出 Origin-Agent-Cluster: ?1

# --- 中间件开关 ---
# 执行顺序可在代码中通过 SetMiddlewareOrder 自定义（config 不提供该字段）。
# 默认顺序：recovery → request_id → body_limit → timeout → cors → validation
#           → security → gzip → rate_limit → metrics → access_log
# 语义：靠前的中间件先进入请求处理，响应阶段按相反顺序收尾。
middleware_request_id = true
middleware_recovery = true
middleware_timeout = true
middleware_cors = true
middleware_validation = true
middleware_gzip = true
middleware_metrics = true
